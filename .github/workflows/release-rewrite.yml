name: Controlled Rewrite release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      module:
        description: Module ID with an implemented publication policy
        required: true
        default: ReleaseCheck
        type: string
      version:
        description: Reviewed module snapshot SHA-256 version ID
        required: true
        type: string
      confirm_release:
        description: Confirm publication of this reviewed version
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'JachinGuan/QuantumultX-Personal' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.confirm_release
    concurrency:
      group: rewrite-publication
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify rulesets and repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          QX_RELEASE_POLICY: ${{ vars.QX_RELEASE_POLICY }}
        run: python3 scripts/release_preflight.py run
      - name: Validate version and prepare release commit
        env:
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          python3 scripts/publish_rewrite.py verify-origin "$VERSION" --module "$MODULE"
          bash scripts/release_git.sh build "$VERSION" "$RUNNER_TEMP/qx-publication" "$MODULE"
      - name: Append release and record immutable URL
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          release_tree="$RUNNER_TEMP/qx-publication"
          bash scripts/release_git.sh push "$VERSION" "$release_tree" "$MODULE"
          revision="$(git -C "$release_tree" rev-parse HEAD)"
          path="published/$MODULE/$VERSION/$MODULE.conf"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$revision/$path"
          printf 'Publication commit: %s\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
          curl --proto '=https' --fail --silent --show-error --retry 4 --retry-all-errors --max-time 8 --output "$RUNNER_TEMP/published-rule.conf" "$url"
          cmp "$release_tree/$path" "$RUNNER_TEMP/published-rule.conf"
          printf 'Verified immutable URL: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
