name: QX upstream monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check upstream files (download only, never execute)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, urllib.error, datetime
          from urllib.parse import urlsplit

          # Edit this list to add/remove remote QX rewrite resources.
          # Each URL is fetched as untrusted TEXT, never executed.
          sources = {
              'RedditAds': 'https://raw.githubusercontent.com/ddgksf2013/Rewrite/refs/heads/master/AdBlock/RedditAds.conf',
              'RedditEnhance': 'https://gist.githubusercontent.com/RavelloH/68ed0626dae69a1ce7c8ad6887087ea1/raw/main.snippet',
              'BiliBiliAdsLite': 'https://ddgksf2013.top/rewrite/BiliBiliAdsLite.conf',
              'Spotify': 'https://raw.githubusercontent.com/app2smile/rules/master/module/spotify.conf',
              'StartUpAds': 'https://ddgksf2013.top/rewrite/StartUpAds.conf',
              'CaiYunAds': 'https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/CaiYunAds.conf',
              'ZhiHu': 'https://ddgksf2013.top/scripts/zhihu.ads.js',
              'YouTubeAds': 'https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf',
              'AmapAds': 'https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/AmapAds.conf',
              'GoogleRedirect': 'https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/Html/General.conf',
              'XiaoHongShu': 'https://ddgksf2013.top/rewrite/XiaoHongShuAds.conf',
              'BoxJS': 'https://raw.githubusercontent.com/chavyleung/scripts/master/box/rewrite/boxjs.rewrite.quanx.conf',
              'WeatherKit': 'https://github.com/NSRingo/WeatherKit/releases/latest/download/iRingo.WeatherKit.snippet',
          }

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPO']
          api = f'https://api.github.com/repos/{repo}/issues'
          def request(url, method='GET', payload=None):
              headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'qx-upstream-monitor'}
              data = json.dumps(payload).encode() if payload is not None else None
              if data is not None: headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as res:
                  return json.load(res)

          # Issue body is our durable baseline; no repository write permission needed.
          title = '[QX Monitor] Upstream change log'
          issues = request(api + '?state=all&per_page=100')
          issue = next((i for i in issues if i.get('title') == title and not i.get('pull_request')), None)
          previous = {}
          if issue:
              body = issue.get('body') or ''
              start, end = '<!-- QX_STATE_BEGIN -->', '<!-- QX_STATE_END -->'
              if start in body and end in body:
                  try: previous = json.loads(body.split(start,1)[1].split(end,1)[0].strip())
                  except ValueError: pass
          current, changes, failures = {}, [], []
          for name, url in sources.items():
              try:
                  # Limit payload to 2 MiB; prevent unexpected redirects to insecure HTTP.
                  req = urllib.request.Request(url, headers={'User-Agent':'QX-upstream-monitor/1.0'})
                  with urllib.request.urlopen(req, timeout=18) as res:
                      if urlsplit(res.url).scheme != 'https': raise ValueError('redirected to non-HTTPS URL')
                      data = res.read(2*1024*1024 + 1)
                  if len(data) > 2*1024*1024: raise ValueError('file exceeds 2 MiB')
                  digest = hashlib.sha256(data).hexdigest()
                  current[name] = {'url':url, 'sha256':digest}
                  old = previous.get(name,{}).get('sha256')
                  if old and old != digest: changes.append(f'- **{name}** changed: `{old[:12]}` → `{digest[:12]}`')
                  elif not old: changes.append(f'- **{name}** added to monitoring (baseline recorded)')
              except Exception as exc:
                  failures.append(f'- **{name}**: {type(exc).__name__}: {str(exc)[:140]}')
                  if name in previous: current[name] = previous[name]

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          report = [f'## Last check: {now}', '', '### Detected changes (not approved or published)', *(changes or ['- No changes']), '', '### Fetch failures', *(failures or ['- None']), '', '### Security note', '- This workflow downloads untrusted resources as bytes only. It does not run, approve, or publish third-party scripts.', '- SHA-256 changes indicate changed content, not whether it is safe.', '', '<!-- QX_STATE_BEGIN -->', json.dumps(current, ensure_ascii=False, indent=2), '<!-- QX_STATE_END -->']
          body = '\n'.join(report)
          if issue:
              request(api + '/' + str(issue['number']), 'PATCH', {'body':body})
              if changes:
                  request(api + '/' + str(issue['number']) + '/comments', 'POST', {'body': f'### {now}\n' + '\n'.join(changes) + '\n\nNot reviewed; no QX publication.'})
          else:
              request(api, 'POST', {'title':title, 'body':body})
          print(f'Checked {len(sources)} sources: {len(changes)} changes, {len(failures)} failures')
          if failures: print('\n'.join(failures))
          PY
